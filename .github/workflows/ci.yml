name: Release

# Branch pushes and pull requests deliberately do not build the application.
# A manual run on the default branch seeds a cache that future tags can restore.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded trial tags share one slot; each formal release keeps its own run.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'cache-warmup' || (startsWith(github.ref, 'refs/tags/build/') && 'trial' || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/build/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    name: ${{ matrix.platform }}
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: macOS-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: Windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: Linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version
        run: python scripts/release-version.py
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            fontconfig \
            libfontconfig1-dev \
            zip
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          # Tags restore the default-branch cache without duplicating it per trial ref.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Cache status
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: python -c "import os; print('Rust cache exact hit:', os.environ.get('CACHE_HIT') or 'false')"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Install CJK export fonts
        run: python scripts/install-ci-fonts.py
      - name: Tests
        run: cargo test --locked --workspace --all-features --no-fail-fast --target ${{ matrix.target }} -- --test-threads=1
      - name: Documentation
        run: cargo doc --locked --workspace --all-features --no-deps --target ${{ matrix.target }}
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Export smoke test
        run: cargo run --locked --target ${{ matrix.target }} -p pecan-export --example export_document -- samples/acceptance.md target/export-smoke
      # Signing is skipped when the secrets are absent, which keeps forks and trial tags building.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE" ] || { echo "No signing certificate; the bundle is ad-hoc signed."; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: sh scripts/bundle-macos.sh ${{ matrix.target }}
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/bundle-windows.ps1 -Target '${{ matrix.target }}'
      - name: Package Linux
        if: runner.os == 'Linux'
        run: sh scripts/bundle-linux.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pecan-${{ matrix.platform }}
          path: |
            dist/Pecan-*.zip
            dist/Pecan-*-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Non-version tags can verify builds without creating a public release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Pecan-* > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # SemVer pre-release tags such as v1.0.0-beta.1 must not become the latest release.
        run: |
          prerelease=
          case "$RELEASE_TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Pecan ${RELEASE_TAG#v}" --generate-notes $prerelease
