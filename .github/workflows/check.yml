name: Check
# Every pull request is formatted, linted, tested and audited on all three platforms
# before it can merge. Packaging stays in the release workflow.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Advisories, licenses and registry sources, configured in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
            target: aarch64-apple-darwin
          - platform: Windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: Linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers fontconfig libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.target }}
          save-if: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CJK export fonts
        run: python scripts/install-ci-fonts.py
      - name: Tests
        run: cargo test --locked --workspace --all-features --no-fail-fast --target ${{ matrix.target }} -- --test-threads=1
